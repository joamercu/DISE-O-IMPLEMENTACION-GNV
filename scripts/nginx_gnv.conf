# ============================================
# Configuración Nginx para aplicación GNV
# Solo debe responder a gnv.weldtech.cloud
# ============================================

# Configuración para la aplicación Streamlit (puerto 8501)
server {
    listen 80;
    server_name gnv.weldtech.cloud;  # SOLO este dominio
    
    # Redirigir HTTP a HTTPS (opcional, si tienes SSL)
    # return 301 https://$server_name$request_uri;
    
    # Si no usas HTTPS, descomenta lo siguiente:
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# Configuración para la API (puerto 8000)
server {
    listen 80;
    server_name api-gnv.weldtech.cloud;  # SOLO este dominio para la API
    
    # Redirigir HTTP a HTTPS (opcional, si tienes SSL)
    # return 301 https://$server_name$request_uri;
    
    # Si no usas HTTPS, descomenta lo siguiente:
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================
# IMPORTANTE: NO configurar server_name weldtech.cloud aquí
# El dominio weldtech.cloud debe tener su propia configuración
# que apunte a otra aplicación diferente
# ============================================

